<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>เข้าสู่ระบบ - แอดมิน สลากดิจิทัล GSB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>เข้าสู่ระบบแอดมิน</h1>
    <nav>
      <a href="index.html">หน้าหลัก</a>
    </nav>
  </header>

  <form id="login-form" data-testid="login-form">
    <label>
      ชื่อผู้ใช้
      <input name="username" data-testid="username-input" required />
    </label>
    <label>
      รหัสผ่าน
      <input name="password" type="password" data-testid="password-input" required />
    </label>
    <button type="submit" data-testid="submit-button">เข้าสู่ระบบ</button>
  </form>

  <p id="message" class="hidden" data-testid="message"></p>

  <script src="api.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage(message);

      const formData = new FormData(form);
      try {
        const data = await apiFetch("/admin/login", {
          method: "POST",
          body: JSON.stringify({
            username: formData.get("username"),
            password: formData.get("password"),
          }),
        });
        setAdminToken(data.token);
        window.location.href = "dashboard.html";
      } catch (err) {
        // 401 here always means a rejected credential, not an expired
        // session (there's no session yet) - the generic MESSAGE_BY_STATUS
        // copy for 401 talks about re-logging in, which reads oddly on the
        // login page itself, so this one status gets its own copy.
        showMessage(message, err.status === 401 ? "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง" : messageForError(err));
      }
    });
  </script>
</body>
</html>
