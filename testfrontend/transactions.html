<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Transaction history - GSB Salak</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Transaction history</h1>
    <nav>
      <a href="dashboard.html" data-testid="nav-dashboard">Back to dashboard</a>
    </nav>
  </header>

  <p id="message" class="hidden" data-testid="message"></p>

  <table data-testid="transactions-table">
    <thead>
      <tr>
        <th>Type</th>
        <th>Amount</th>
        <th>Balance after</th>
        <th>Description</th>
        <th>Created at</th>
      </tr>
    </thead>
    <tbody id="transactions-body" data-testid="transactions-body"></tbody>
  </table>

  <script src="api.js"></script>
  <script>
    requireAuth();

    const message = document.getElementById("message");
    const transactionsBody = document.getElementById("transactions-body");

    const params = new URLSearchParams(window.location.search);
    const accountId = params.get("account_id");

    async function loadHistory() {
      if (!accountId) {
        showError(message, new Error("Missing account_id query parameter"));
        return;
      }

      try {
        const entries = await apiFetch(`/transactions?account_id=${accountId}`);
        transactionsBody.innerHTML = "";

        for (const entry of entries) {
          const row = document.createElement("tr");
          row.dataset.testid = "transaction-row";
          row.innerHTML = `
            <td data-testid="transaction-type">${entry.type}</td>
            <td data-testid="transaction-amount">${entry.amount}</td>
            <td data-testid="transaction-balance-after">${entry.balance_after}</td>
            <td data-testid="transaction-description">${entry.description}</td>
            <td data-testid="transaction-created-at">${entry.created_at}</td>
          `;
          transactionsBody.appendChild(row);
        }
      } catch (err) {
        showError(message, err);
      }
    }

    loadHistory();
  </script>
</body>
</html>
