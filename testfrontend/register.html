<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - GSB Salak</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Register</h1>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <form id="register-form" data-testid="register-form">
    <label>
      Username
      <input name="username" data-testid="username-input" required />
    </label>
    <label>
      Password
      <input name="password" type="password" data-testid="password-input" required />
    </label>
    <label>
      Full name
      <input name="full_name" data-testid="full-name-input" required />
    </label>
    <button type="submit" data-testid="submit-button">Register</button>
  </form>

  <p id="message" class="hidden" data-testid="message"></p>
  <p><a href="login.html" data-testid="nav-login">Already have an account? Log in</a></p>

  <script src="api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage(message);

      const formData = new FormData(form);
      try {
        await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            username: formData.get("username"),
            password: formData.get("password"),
            full_name: formData.get("full_name"),
          }),
        });
        message.textContent = "Registration successful. You can now log in.";
        message.classList.remove("hidden");
        message.dataset.status = "success";
      } catch (err) {
        showError(message, err);
        message.dataset.status = "error";
      }
    });
  </script>
</body>
</html>
