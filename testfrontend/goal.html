<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kapook Goal - GSB Salak</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Kapook Goal</h1>
    <nav>
      <a href="dashboard.html" data-testid="nav-dashboard">Dashboard</a>
      <button id="logout-button" data-testid="logout-button">Log out</button>
    </nav>
  </header>

  <section id="goal-view" class="hidden" data-testid="goal-view">
    <h2>Your goal</h2>
    <ul>
      <li>Target: <span data-testid="goal-target"></span> THB</li>
      <li>Saved: <span data-testid="goal-saved"></span> THB</li>
      <li>Converted to Salak: <span data-testid="goal-converted"></span> THB</li>
      <li>Progress: <span data-testid="goal-progress"></span>%</li>
    </ul>

    <p id="countdown-status" class="hidden" data-testid="countdown-status"></p>
    <p id="auto-purchase-result" class="hidden" data-testid="auto-purchase-result"></p>

    <h3>Pay in</h3>
    <form id="deposit-form" data-testid="deposit-form">
      <label>
        From savings account
        <select name="savings_account_id" data-testid="savings-account-select" required></select>
      </label>
      <label>
        Amount (THB)
        <input name="amount" type="number" data-testid="deposit-amount-input" required />
      </label>
      <button type="submit" data-testid="deposit-submit">Pay in</button>
    </form>

    <h3>Withdraw</h3>
    <p data-testid="withdrawal-status"></p>
    <form id="withdraw-form" data-testid="withdraw-form">
      <label>
        To savings account
        <select name="savings_account_id" data-testid="withdraw-savings-account-select" required></select>
      </label>
      <label>
        Amount (THB)
        <input name="amount" type="number" data-testid="withdraw-amount-input" required />
      </label>
      <button type="submit" data-testid="withdraw-submit">Withdraw</button>
    </form>
    <p id="withdraw-result" class="hidden" data-testid="withdraw-result"></p>

    <h3>Buy Salak from this goal</h3>
    <form id="buy-form" data-testid="buy-form">
      <label>
        Into Salak account
        <select name="salak_account_id" data-testid="buy-salak-account-select" required></select>
      </label>
      <label>
        Amount (THB)
        <input name="amount" type="number" step="1000" data-testid="buy-amount-input" required />
      </label>
      <button type="submit" data-testid="buy-submit">Buy Salak</button>
    </form>
    <p id="buy-result" class="hidden" data-testid="buy-result"></p>
  </section>

  <section id="goal-form-section" data-testid="goal-form-section">
    <h2>Set a savings goal</h2>
    <form id="goal-form" data-testid="goal-form">
      <label>
        Salak product
        <select name="product_id" data-testid="product-select" required></select>
      </label>
      <label>
        Target amount (THB)
        <input name="goal_amount" type="number" step="1000" data-testid="goal-amount-input" required />
      </label>
      <button type="submit" data-testid="create-goal-submit">Create goal</button>
    </form>
  </section>

  <p id="message" class="hidden" data-testid="message"></p>

  <script src="api.js"></script>
  <script>
    requireAuth();

    const goalView = document.getElementById("goal-view");
    const goalFormSection = document.getElementById("goal-form-section");
    const goalForm = document.getElementById("goal-form");
    const productSelect = document.querySelector('[name="product_id"]');
    const depositForm = document.getElementById("deposit-form");
    const savingsAccountSelect = document.querySelector('[name="savings_account_id"]');
    const withdrawForm = document.getElementById("withdraw-form");
    const withdrawSavingsAccountSelect = document.querySelector('[data-testid="withdraw-savings-account-select"]');
    const withdrawalStatusEl = document.querySelector('[data-testid="withdrawal-status"]');
    const withdrawResultEl = document.getElementById("withdraw-result");
    const buyForm = document.getElementById("buy-form");
    const buySalakAccountSelect = document.querySelector('[data-testid="buy-salak-account-select"]');
    const buyResultEl = document.getElementById("buy-result");
    const message = document.getElementById("message");
    const countdownStatusEl = document.getElementById("countdown-status");
    const autoPurchaseResultEl = document.getElementById("auto-purchase-result");

    let kapookAccountId = null;
    let pollTimer = null;
    let holdingIdsBeforeCountdown = null;

    function renderGoal(goal) {
      document.querySelector('[data-testid="goal-target"]').textContent = goal.goal_amount;
      document.querySelector('[data-testid="goal-saved"]').textContent = goal.saving_amount;
      document.querySelector('[data-testid="goal-converted"]').textContent = goal.salak_amount;
      const target = Number(goal.goal_amount);
      const saved = Number(goal.saving_amount);
      const progress = target > 0 ? Math.round((saved / target) * 100) : 0;
      document.querySelector('[data-testid="goal-progress"]').textContent = String(progress);
      goalView.classList.remove("hidden");
      goalFormSection.classList.add("hidden");
      refreshWithdrawalStatus();
      updateCountdownStatus(goal);
    }

    // A "purchase pending" state, not a live ticking timer: the worker can
    // legitimately defer past the nominal deadline on a draw day, and a
    // countdown stalled at 00:00:00 would read as broken rather than as
    // "waiting its turn." Polls /kapook/goals/active until it 404s (the
    // goal went inactive - bought, or closed by a countdown withdrawal),
    // then shows the resulting holding.
    function updateCountdownStatus(goal) {
      if (goal.goal_reached_at && goal.is_active) {
        countdownStatusEl.textContent = "Target reached! Automatic purchase pending - this can take up to a minute.";
        countdownStatusEl.classList.remove("hidden");
        startPollingForAutoPurchase();
      } else {
        countdownStatusEl.classList.add("hidden");
        stopPolling();
      }
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    async function startPollingForAutoPurchase() {
      if (pollTimer) return;
      // purchase_date is a date, not a timestamp - two holdings bought on
      // the same calendar day tie under the holdings list's "ORDER BY
      // purchase_date DESC", so "the last one in the array" is never a
      // safe way to find the one this countdown just bought. Snapshot
      // what already exists before polling starts, and diff against it
      // once the goal resolves instead.
      if (holdingIdsBeforeCountdown === null) {
        const accounts = await apiFetch("/accounts");
        const salakAccount = accounts.find((a) => a.type === "salak");
        const holdings = await apiFetch(`/salak/holdings?account_id=${salakAccount.id}`);
        holdingIdsBeforeCountdown = new Set(holdings.map((h) => h.id));
      }
      pollTimer = setInterval(async () => {
        try {
          await apiFetch(`/kapook/goals/active?account_id=${kapookAccountId}`);
        } catch (err) {
          // 404: the goal is no longer active - the auto-purchase (or a
          // manual full buy, or a during-countdown withdrawal) resolved it.
          await handleGoalNoLongerActive();
        }
      }, 2000);
    }

    async function handleGoalNoLongerActive() {
      stopPolling();
      countdownStatusEl.textContent = "The goal is no longer active - checking what happened...";

      const accounts = await apiFetch("/accounts");
      const salakAccount = accounts.find((a) => a.type === "salak");
      const holdings = await apiFetch(`/salak/holdings?account_id=${salakAccount.id}`);
      const newHoldings = holdings.filter((h) => !holdingIdsBeforeCountdown.has(h.id));
      holdingIdsBeforeCountdown = null;

      if (newHoldings.length > 0) {
        const bought = newHoldings[0];
        countdownStatusEl.textContent = "Automatic purchase completed.";
        autoPurchaseResultEl.textContent = `Holding: ${bought.units} units, tickets ${bought.ticket_start} to ${bought.ticket_end}.`;
        autoPurchaseResultEl.classList.remove("hidden");
      } else {
        countdownStatusEl.textContent = "The goal closed without a purchase (likely a withdrawal during the countdown).";
      }
      goalFormSection.classList.remove("hidden");
    }

    async function refreshWithdrawalStatus() {
      try {
        const status = await apiFetch(`/kapook/goals/withdrawal-status?kapook_account_id=${kapookAccountId}`);
        withdrawalStatusEl.textContent = status.next_withdrawal_is_free
          ? `Next withdrawal is free (${status.free_withdrawals_remaining} of 2 remaining this window).`
          : "Next withdrawal will carry a 2% fee (no free withdrawals left this window).";
      } catch (err) {
        withdrawalStatusEl.textContent = "";
      }
    }

    async function loadProducts() {
      const products = await apiFetch("/salak/products");
      for (const p of products) {
        productSelect.appendChild(new Option(p.name, p.id));
      }
    }

    async function init() {
      const accounts = await apiFetch("/accounts");
      const kapookAccount = accounts.find((a) => a.type === "kapook");
      kapookAccountId = kapookAccount.id;

      for (const a of accounts.filter((a) => a.type === "savings")) {
        savingsAccountSelect.appendChild(new Option(`${a.account_number} (${a.balance} THB)`, a.id));
        withdrawSavingsAccountSelect.appendChild(new Option(`${a.account_number} (${a.balance} THB)`, a.id));
      }
      for (const a of accounts.filter((a) => a.type === "salak")) {
        buySalakAccountSelect.appendChild(new Option(`${a.account_number} (${a.balance} THB)`, a.id));
      }

      await loadProducts();

      try {
        const goal = await apiFetch(`/kapook/goals/active?account_id=${kapookAccountId}`);
        renderGoal(goal);
      } catch (err) {
        // No active goal yet (404) - the create form stays visible.
      }
    }

    goalForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage(message);

      const formData = new FormData(goalForm);
      try {
        const goal = await apiFetch("/kapook/goals", {
          method: "POST",
          body: JSON.stringify({
            account_id: kapookAccountId,
            product_id: formData.get("product_id"),
            goal_amount: Number(formData.get("goal_amount")),
          }),
        });
        renderGoal(goal);
      } catch (err) {
        showError(message, err);
      }
    });

    depositForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage(message);

      const formData = new FormData(depositForm);
      try {
        const goal = await apiFetch("/kapook/goals/deposit", {
          method: "POST",
          body: JSON.stringify({
            kapook_account_id: kapookAccountId,
            savings_account_id: formData.get("savings_account_id"),
            amount: Number(formData.get("amount")),
          }),
        });
        renderGoal(goal);
        depositForm.reset();
      } catch (err) {
        showError(message, err);
      }
    });

    withdrawForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage(message);
      withdrawResultEl.classList.add("hidden");

      const formData = new FormData(withdrawForm);
      try {
        const result = await apiFetch("/kapook/goals/withdraw", {
          method: "POST",
          body: JSON.stringify({
            kapook_account_id: kapookAccountId,
            savings_account_id: formData.get("savings_account_id"),
            amount: Number(formData.get("amount")),
          }),
        });
        renderGoal(result.goal);
        withdrawResultEl.textContent = result.fee_charged
          ? `Withdrawn ${result.amount} THB, 2% fee applied - ${result.net_credited} THB reached savings.`
          : `Withdrawn ${result.amount} THB, no fee - ${result.net_credited} THB reached savings.`;
        withdrawResultEl.classList.remove("hidden");
        withdrawForm.reset();
      } catch (err) {
        showError(message, err);
      }
    });

    buyForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage(message);
      buyResultEl.classList.add("hidden");

      const formData = new FormData(buyForm);
      try {
        const result = await apiFetch("/kapook/goals/buy", {
          method: "POST",
          body: JSON.stringify({
            kapook_account_id: kapookAccountId,
            salak_account_id: formData.get("salak_account_id"),
            amount: Number(formData.get("amount")),
          }),
        });
        renderGoal(result.goal);
        buyResultEl.textContent = `Bought ${result.amount} THB of ${result.product_name} - tickets ${result.ticket_start} to ${result.ticket_end}.` +
          (result.goal_completed ? " Goal fully converted and closed." : "");
        buyResultEl.classList.remove("hidden");
        buyForm.reset();
      } catch (err) {
        showError(message, err);
      }
    });

    init();

    document.getElementById("logout-button").addEventListener("click", () => {
      clearToken();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
